# 태그(vX.Y.Z)를 올리면 설치파일을 빌드해서 GitHub Releases에 올린다.
# 앱의 "업데이트 확인"은 여기 올라간 최신 릴리스를 보고 업데이트한다.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Mono and NSIS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mono-mcs mono-devel nsis

      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "AssemblyVersion(\"${TAG}.0\")" src/Program.cs || { echo "src/Program.cs version != $TAG"; exit 1; }
          grep -q "!define VERSION \"${TAG}\"" installer.nsi || { echo "installer.nsi version != $TAG"; exit 1; }

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh
          makensis -V2 installer.nsi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILE="out/UsageQuest-Setup-${TAG#v}.exe"
          SHA=$(sha256sum "$FILE" | cut -d' ' -f1)
          NOTES_FILE=release-notes.md
          if [ -f "notes/${TAG}.md" ]; then cp "notes/${TAG}.md" "$NOTES_FILE"; else echo "Usage Quest ${TAG#v}" > "$NOTES_FILE"; fi
          printf '\n\nsha256: %s\n' "$SHA" >> "$NOTES_FILE"
          gh release create "$TAG" "$FILE" --title "Usage Quest ${TAG#v}" --notes-file "$NOTES_FILE"
